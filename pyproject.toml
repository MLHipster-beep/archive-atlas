[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archive-atlas"
version = "0.2.0"
description = "Index an APT archive and answer dependency questions about it"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aditya", email = "aditya16011664@gmail.com" }]
keywords = ["apt", "debian", "ubuntu", "archive", "dependencies"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Software Distribution",
]
dependencies = []

[project.scripts]
archive-atlas = "archive_atlas.cli:main"

[project.urls]
Homepage = "https://github.com/placeholder/archive-atlas"

[tool.setuptools.packages.find]
where = ["src"]
